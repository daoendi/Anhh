<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thử Thách Tri Thức</title>
<meta name="description" content="Trò chơi trắc nghiệm theo tổ cho bài Định luật tuần hoàn: 10 câu, 4 quyền trợ giúp, tính điểm theo mức độ và báo cáo kết quả.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: màn bắt đầu toàn màn hình (tên + nút). Màn chơi: sân khấu xanh + câu hỏi + 4 đáp án 2×2, cột phải là trợ giúp, điểm các tổ, thang điểm. */
  --bg: #f0f2f5;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --btn-2: #e4e6eb;
  --btn-2-hover: #d8dadf;
  --hover: #f2f2f2;
  --ink: #050505;
  --muted: #65676b;
  --line: #ced0d4;
  --divider: #e4e6eb;
  --accent: #1877f2;
  --accent-hover: #166fe5;
  --accent-soft: #e7f3ff;
  --ok: #31a24c;
  --ok-soft: #e3f5e7;
  --bad: #e41e3f;
  --bad-soft: #fde7ea;
  --warn: #f7b928;
  --warn-soft: #fff6d9;
  --shadow: 0 1px 2px rgba(0, 0, 0, .2);
  --shadow-lg: 0 12px 28px rgba(0, 0, 0, .2), 0 2px 4px rgba(0, 0, 0, .1);
  --stage: radial-gradient(120% 100% at 50% 110%, #3b97ff 0%, #1877f2 38%, #0b3d91 100%);
  --font-body: "Be Vietnam Pro", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18191a; --surface: #242526; --surface-2: #3a3b3c; --btn-2: #3a3b3c; --btn-2-hover: #4e4f50; --hover: #303031;
    --ink: #e4e6eb; --muted: #b0b3b8; --line: #3e4042; --divider: #3e4042;
    --accent: #2d88ff; --accent-hover: #4599ff; --accent-soft: #263951;
    --ok: #45bd62; --ok-soft: #1e3a26; --bad: #f3425f; --bad-soft: #4a1f27; --warn: #f7b928; --warn-soft: #4a3b12;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5); --shadow-lg: 0 12px 28px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18191a; --surface: #242526; --surface-2: #3a3b3c; --btn-2: #3a3b3c; --btn-2-hover: #4e4f50; --hover: #303031;
  --ink: #e4e6eb; --muted: #b0b3b8; --line: #3e4042; --divider: #3e4042;
  --accent: #2d88ff; --accent-hover: #4599ff; --accent-soft: #263951;
  --ok: #45bd62; --ok-soft: #1e3a26; --bad: #f3425f; --bad-soft: #4a1f27; --warn: #f7b928; --warn-soft: #4a3b12;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5); --shadow-lg: 0 12px 28px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 80; }

/* Start screen */
.start { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px 16px; overflow: hidden; background: var(--stage); color: #fff; text-align: center; }
.start-inner { position: relative; display: flex; flex-direction: column; align-items: center; gap: 20px; }
.start-emblem { width: clamp(88px, 14vw, 132px); height: clamp(88px, 14vw, 132px); }
.start-emblem svg { width: 100%; height: 100%; }
.start h1 { font-size: clamp(40px, 8vw, 88px); font-weight: 800; line-height: 1.02; letter-spacing: -.01em; }
.start-sub { margin: -8px 0 0; font-size: clamp(16px, 2.2vw, 22px); font-weight: 600; opacity: .9; }
.start-btn { margin-top: 8px; display: inline-flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 44px; border-radius: 999px; border: 0; background: #fff; color: #0b3d91; font-size: clamp(20px, 2.6vw, 26px); font-weight: 800; cursor: pointer; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); transition: transform .12s, box-shadow .12s; }
.start-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(0, 0, 0, .3); }
.start-btn:active { transform: translateY(1px); }
.start-btn svg { width: 26px; height: 26px; }
.beam { position: absolute; top: -30%; width: 34%; height: 170%; background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0) 75%); clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%); transform-origin: 50% 0; opacity: .45; pointer-events: none; }
.beam.l { left: 4%; animation: sweepL 7s ease-in-out infinite alternate; }
.beam.r { right: 4%; animation: sweepR 8s ease-in-out infinite alternate; }
@keyframes sweepL { from { transform: rotate(-28deg); } to { transform: rotate(18deg); } }
@keyframes sweepR { from { transform: rotate(26deg); } to { transform: rotate(-20deg); } }

/* Top bar (shown outside the start screen when not presenting) */
.topbar { position: sticky; top: 0; z-index: 30; height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 16px; background: var(--surface); box-shadow: var(--shadow); }
body[data-view="home"] .topbar, body[data-view="home"] .present-bar { display: none !important; }
.brand { display: inline-flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; }
.logo { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
.logo svg { width: 24px; height: 24px; }
.brand-name { font-weight: 800; font-size: 18px; color: var(--accent); white-space: nowrap; }
.tb-right { display: flex; gap: 8px; }
.round-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--btn-2); display: inline-grid; place-items: center; cursor: pointer; flex: none; }
.round-btn:hover { background: var(--btn-2-hover); }
.round-btn svg { width: 20px; height: 20px; }
.round-btn.sm { width: 32px; height: 32px; }
.round-btn.sm svg { width: 16px; height: 16px; }
.round-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

/* Buttons & inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: 6px; border: 0; background: var(--btn-2); font-weight: 600; font-size: 15px; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--btn-2-hover); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn svg { width: 18px; height: 18px; flex: none; }
.dl-only { display: none !important; }
body.has-dl .dl-only { display: inline-flex !important; }
.input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; min-height: 38px; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.label { font-size: 13px; font-weight: 600; color: var(--muted); }

main { width: 100%; padding: 16px; }
.card { background: var(--surface); border-radius: 8px; box-shadow: var(--shadow); padding: 16px; }
.lv { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12.5px; font-weight: 700; background: var(--surface-2); color: var(--muted); }
.lv.NB { background: var(--accent-soft); color: var(--accent); }
.lv.TH { background: var(--ok-soft); color: var(--ok); }
.lv.VD { background: var(--warn-soft); color: #b7860b; }
.lv.VDC { background: var(--bad-soft); color: var(--bad); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); font-size: 13px; font-weight: 600; color: var(--muted); }

/* Game */
.game { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; max-width: 1400px; margin: 0 auto; }
.game-main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stage { position: relative; overflow: hidden; border-radius: 8px; box-shadow: var(--shadow); color: #fff; padding: 14px 16px 18px; background: var(--stage); }
.stage.suspense .beam { animation-duration: .9s; opacity: .75; }
.stage.flash-ok { box-shadow: 0 0 0 4px var(--ok), var(--shadow); }
.stage.flash-bad { box-shadow: 0 0 0 4px var(--bad), var(--shadow); animation: shake .4s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.stage-top { position: relative; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 40px; }
.stage-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: rgba(255,255,255,.16); font-weight: 600; font-size: 14px; }
.stage-chip.team { background: var(--warn); color: #3b2a00; }
.stage-ctrls { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.stage-ctrls .round-btn { background: rgba(255,255,255,.16); color: #fff; }
.stage-ctrls .round-btn:hover { background: rgba(255,255,255,.28); }
.stage-center { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; padding-top: 4px; }
.emblem { width: 60px; height: 60px; color: #fff; }
.emblem svg { width: 100%; height: 100%; }
.stage-label { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.stage-prize { font-size: clamp(30px, 4.2vw, 56px); font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stage-sub { font-size: 13.5px; opacity: .85; }
.timer { position: relative; width: 52px; height: 52px; flex: none; }
.timer svg { width: 52px; height: 52px; transform: rotate(-90deg); }
.timer circle { fill: none; stroke-width: 5; }
.timer .track { stroke: rgba(255,255,255,.25); }
.timer .prog { stroke: #fff; stroke-linecap: round; transition: stroke-dashoffset .9s linear; }
.timer.low .prog { stroke: var(--warn); }
.timer span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.play-area { display: flex; flex-direction: column; gap: 12px; }
.qcard { text-align: center; padding: 18px 20px 22px; }
.qhead { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.turn-pick { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.turn-pick span { font-size: 13px; color: var(--muted); font-weight: 600; }
.pick { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
.pick:hover:not(:disabled) { background: var(--hover); }
.pick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.pick:disabled { opacity: .5; cursor: default; }
.qtext { margin: 0 auto; max-width: 80ch; font-size: clamp(22px, 2.6vw, 40px); font-weight: 700; line-height: 1.4; white-space: pre-wrap; }
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opt { display: flex; align-items: center; gap: 14px; text-align: left; min-height: 84px; padding: 12px 16px; border-radius: 8px; border: 2px solid transparent; background: var(--surface); box-shadow: var(--shadow); cursor: pointer; font-size: clamp(18px, 1.8vw, 28px); font-weight: 500; line-height: 1.35; transition: background .15s, border-color .15s, opacity .2s; }
.opt:hover:not(:disabled) { background: var(--hover); }
.opt .letter { flex: none; display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: 22px; }
.opt .t { min-width: 0; overflow-wrap: anywhere; }
.opt.sel { border-color: var(--warn); background: var(--warn-soft); }
.opt.sel .letter { background: var(--warn); color: #3b2a00; }
.opt.locked { animation: pulse .8s ease-in-out infinite; }
@keyframes pulse { 50% { border-color: transparent; } }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.correct .letter { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .letter { background: var(--bad); color: #fff; }
.opt.gone { opacity: .3; }
.opt.gone .t { text-decoration: line-through; }
.opt:disabled { cursor: default; }
.help-panel { display: flex; flex-wrap: wrap; gap: 12px; }
.help-block { flex: 1 1 280px; display: flex; flex-direction: column; gap: 8px; }
.help-title { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--accent); font-size: 17px; }
.help-title svg { width: 20px; height: 20px; }
.help-block p { margin: 0; font-size: 16px; }
.draw-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.draw-num { font-size: 30px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.pick-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.help-block .note-sm { font-size: 13px; color: var(--muted); }
.confirm-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-left: 4px solid var(--warn); }
.confirm-bar span { font-weight: 700; font-size: 20px; }
.confirm-bar div { display: flex; gap: 8px; }
.confirm-bar .btn { min-height: 44px; font-size: 17px; padding: 0 18px; }
.reveal { display: flex; flex-direction: column; gap: 6px; border-left: 4px solid var(--ok); }
.reveal.bad { border-left-color: var(--bad); }
.reveal-title { font-size: 28px; font-weight: 800; }
.reveal.ok .reveal-title { color: var(--ok); }
.reveal.bad .reveal-title { color: var(--bad); }
.reveal p { margin: 0; font-size: 18px; }
.reveal .reveal-ex { color: var(--muted); font-size: 16px; }
.reveal-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 6px; }
.reveal-actions .btn { min-height: 46px; font-size: 18px; padding: 0 22px; }
.game-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.kbd-hint { font-size: 12.5px; color: var(--muted); }
.side { position: sticky; top: 72px; display: flex; flex-direction: column; gap: 12px; }
.side-card { padding: 12px; }
.side-title { font-weight: 700; font-size: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; gap: 8px; }
.side-title small { font-weight: 600; color: var(--accent); font-size: 13px; }
.lifelines { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.life { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: none; cursor: pointer; padding: 0; font-size: 12px; font-weight: 600; color: var(--muted); line-height: 1.15; text-align: center; }
.life .ring { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); border: 2px solid transparent; position: relative; }
.life .ring svg { width: 24px; height: 24px; }
.life .big { font-weight: 800; font-size: 15px; }
.life:hover:not(:disabled) .ring { border-color: var(--accent); }
.life:disabled { cursor: not-allowed; opacity: .4; }
.life.used .ring::after { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; height: 3px; border-radius: 2px; background: var(--bad); transform: rotate(-35deg); }
.life-caption { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); text-align: center; min-height: 18px; }
.team-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.team-row { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; }
.team-row.now { background: var(--warn-soft); }
.team-row .tname { font-weight: 700; font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team-row .tsub { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
.team-row .tscore { font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; flex: none; }
.ladder-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.rung { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; font-size: 15px; font-variant-numeric: tabular-nums; }
.rung-n { color: var(--muted); font-weight: 600; text-align: right; }
.rung .lv { justify-self: start; }
.rung-pts { font-weight: 700; }
.rung.ok { background: var(--ok-soft); }
.rung.ok .rung-n { color: var(--ok); }
.rung.bad { background: var(--bad-soft); }
.rung.bad .rung-n { color: var(--bad); }
.rung.current { background: var(--accent); color: #fff; }
.rung.current .rung-n { color: #fff; }
#btnSide { display: none; }

/* Result */
.result { display: grid; grid-template-columns: minmax(0, 460px) minmax(0, 1fr); gap: 16px; align-items: start; max-width: 1300px; margin: 0 auto; }
.result-hero { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 16px; }
.res-top { text-align: center; padding: 18px; border-radius: 8px; color: #fff; background: var(--stage); }
.res-outcome { font-weight: 700; font-size: 17px; opacity: .92; }
.res-big { font-size: clamp(44px, 6vw, 64px); font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
.res-big small { font-size: .4em; margin-left: 4px; }
.res-msg { margin: 0; color: var(--muted); }
.rank-table, .board { width: 100%; border-collapse: collapse; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.rank-table th, .board th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--divider); white-space: nowrap; }
.rank-table td, .board td { padding: 8px; border-bottom: 1px solid var(--divider); }
.rank-table tr.win td { background: var(--warn-soft); font-weight: 700; }
.rank-table td.sc { font-weight: 800; font-size: 17px; }
.table-wrap { overflow-x: auto; }
.res-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: var(--surface-2); border-radius: 8px; padding: 8px 12px; }
.stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--muted); }
.save-row { display: flex; gap: 8px; flex-wrap: wrap; }
.save-row .input { flex: 1 1 160px; }
.res-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.review h2 { font-size: 20px; font-weight: 800; margin: 4px 0 12px; }
.review-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.rv { display: flex; flex-direction: column; gap: 8px; border-left: 4px solid var(--ok); }
.rv.bad { border-left-color: var(--bad); }
.rv-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.rv-q { margin: 0; font-weight: 600; white-space: pre-wrap; }
.rv-opts { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; font-size: 14px; color: var(--muted); }
.rv-opts li.c { color: var(--ok); font-weight: 700; }
.rv-opts li.w { color: var(--bad); text-decoration: line-through; }
.rv-ex { margin: 0; font-size: 14px; color: var(--muted); }
.rv-gain { font-weight: 700; color: var(--ok); }
.rv.bad .rv-gain { color: var(--bad); }

/* Modal, toast, banner */
.modal-backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .55); display: grid; place-items: center; padding: 16px; }
.modal { width: min(540px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; background: var(--surface); border-radius: 8px; box-shadow: var(--shadow-lg); }
.modal.wide { width: min(820px, 100%); }
.modal-head { position: relative; display: flex; align-items: center; justify-content: center; padding: 14px 52px; border-bottom: 1px solid var(--divider); }
.modal-head h3 { font-size: 19px; font-weight: 700; text-align: center; }
.modal-head .round-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); }
.modal-body { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.modal-body p { margin: 0; }
.modal-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--divider); }

const Sound = {
  ctx: null, noiseBuf: null,
  ensure() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { this.ctx = null; } }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    return this.ctx;
  },
  tone(freq, dur, { type = 'sine', vol = 0.12, at = 0, slide = null } = {}) {
    if (!prefs.sound) return;
    const c = this.ensure(); if (!c) return;
    const t0 = c.currentTime + at;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.05);
  },
  hit(at, vol = 0.18) {
    if (!prefs.sound) return;
    const c = this.ensure(); if (!c) return;
    if (!this.noiseBuf) { const len = Math.floor(c.sampleRate * 0.12); this.noiseBuf = c.createBuffer(1, len, c.sampleRate); const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len); }
    const src = c.createBufferSource(); src.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
    const g = c.createGain(); g.gain.value = vol;
    src.connect(f).connect(g).connect(c.destination); src.start(c.currentTime + at);
  },
  start() { [392, 494, 587, 784].forEach((f, i) => this.tone(f, 0.28, { type: 'triangle', at: i * 0.11 })); },
  select() { this.tone(660, 0.07, { type: 'square', vol: 0.04 }); },
  roll(total) { let t = 0, step = 0.16; while (t < total) { this.hit(t, 0.08 + 0.1 * t / total); t += step; step = Math.max(0.045, step * 0.9); } },
  correct() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.32, { type: 'triangle', at: i * 0.08 })); },
  wrong() { this.tone(220, 0.55, { type: 'sawtooth', vol: 0.07, slide: 110 }); this.tone(208, 0.55, { type: 'square', vol: 0.03, slide: 104 }); },
  tick() { this.tone(1250, 0.04, { type: 'square', vol: 0.03 }); },
  help() { this.tone(880, 0.12); this.tone(1320, 0.16, { at: 0.1 }); },
  fanfare() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.4, { type: 'triangle', at: i * 0.12, vol: 0.13 })); }
};

const FX = {
  parts: [], raf: 0, w: 0, h: 0, ctx: null,
  size() {
    const c = $('#fx'); const dpr = Math.min(2, window.devicePixelRatio || 1);
    this.w = window.innerWidth; this.h = window.innerHeight;
    c.width = this.w * dpr; c.height = this.h * dpr;
    this.ctx = c.getContext('2d'); this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  },
  burst(n = 110, x, y) {
    if (reducedMotion) return;
    if (!this.ctx || this.w !== window.innerWidth || this.h !== window.innerHeight) this.size();
    const cols = ['#1877f2', '#f7b928', '#31a24c', '#f02849', '#8a3ffc', '#ffffff'];
    const ox = x == null ? this.w / 2 : x, oy = y == null ? this.h * .4 : y;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 4 + Math.random() * 10;
      this.parts.push({ x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 6, s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[i % cols.length], life: 0, max: 110 + Math.random() * 70 });
    }
    if (!this.raf) this.raf = requestAnimationFrame(() => this.loop());
  },
  rain() { if (reducedMotion) return; if (!this.ctx) this.size(); for (let k = 0; k < 5; k++) setTimeout(() => this.burst(80, this.w * (0.1 + 0.2 * k), this.h * 0.2), k * 220); },
  loop() {
    const x = this.ctx; x.clearRect(0, 0, this.w, this.h);
    this.parts = this.parts.filter(p => p.life < p.max && p.y < this.h + 30);
    for (const p of this.parts) {
      p.life++; p.vy += 0.28; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.globalAlpha = Math.max(0, 1 - p.life / p.max);
      x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore();
    }
    if (this.parts.length) this.raf = requestAnimationFrame(() => this.loop());
    else { this.raf = 0; x.clearRect(0, 0, this.w, this.h); }
  }
};

function reveal(timeout) {

  const helped = G.cur.lifes.size > 0;
  const gain = ok ? (helped ? Math.round(base * G.ratio) : base) : 0;
  team.asked++; if (ok) team.correct++; team.score += gain;
  team.helps += G.cur.lifes.size;
  const helperIdx = [...new Set([...(G.cur.call != null ? [G.cur.call] : []), ...G.cur.council])].filter(i => i !== G.cur.team);
  const giveBonus = ok && G.bonusMilli > 0 && helperIdx.length > 0;

  let sub = ok ? `${team.name} trả lời đúng, được cộng ${fmtPts(gain)} điểm` + (helped ? ' (đã dùng trợ giúp)' : '') + '.'
               : `Đáp án đúng là ${LETTERS[cur.correct]}: ${cur.opts[cur.correct]}. ${team.name} không được cộng điểm câu này.`;
  if (giveBonus) sub += ` ${entry.helpers.join(', ')} được cộng ${fmtPts(G.bonusMilli)} điểm hỗ trợ.`;
  const nextBtn = h('button', { class: 'btn primary', type: 'button', id: 'btnNext', onclick: last ? () => endGame() : nextQuestion }, last ? 'Xem kết quả' : 'Câu tiếp theo');
  const panel = $('#revealPanel');
  panel.className = 'card reveal ' + (ok ? 'ok' : 'bad');
  panel.replaceChildren(
    h('div', { class: 'reveal-title', text: ok ? 'Chính xác!' : timeout ? 'Hết giờ!' : 'Chưa đúng' }),
    h('p', { text: sub }),
    cur.src.ex ? h('p', { class: 'reveal-ex', text: cur.src.ex }) : null,
    h('div', { class: 'reveal-actions' }, nextBtn));
  panel.hidden = false;
  nextBtn.focus({ preventScroll: true });
  panel.scrollIntoView({ block: 'nearest', behavior: reducedMotion ? 'auto' : 'smooth' });
}
function nextQuestion() { if (!G || G.ended) return; G.idx++; renderQuestion(); }
function walkAway() {
  if (!G || G.locked || G.ended) return;
  confirmModal('Kết thúc sớm?', `Đã chơi ${G.idx}/${G.n} câu. Kết thúc và xem kết quả các tổ?`, 'Kết thúc').then(ok => { if (ok && G && !G.locked && !G.ended) endGame(); });
}

/* Đồng hồ */
const CIRC = 2 * Math.PI * 26;
function startTimer() {
  stopTimer();
  G.timeTotal = RULES.timePerQuestion;
  G.timeLeft = G.timeTotal;
  drawTimer();
  G.timer = setInterval(() => {
    if (!G || G.locked) return stopTimer();
    G.timeLeft--; drawTimer();
    if (G.timeLeft > 0 && G.timeLeft <= 5) Sound.tick();
    if (G.timeLeft <= 0) { stopTimer(); timeUp(); }
  }, 1000);
}
function stopTimer() { if (G && G.timer) { clearInterval(G.timer); G.timer = null; } }
function drawTimer() {
  const max = Math.max(G.timeTotal, G.timeLeft) || 1;
  $('#timerNum').textContent = Math.max(0, G.timeLeft);
  $('#timerProg').setAttribute('stroke-dashoffset', String(CIRC * (1 - Math.max(0, G.timeLeft) / max)));
  $('#timer').classList.toggle('low', G.timeLeft <= 5);
}
function addTime(sec) { if (!G.timer) return; G.timeLeft += sec; G.timeTotal = Math.max(G.timeTotal, G.timeLeft); drawTimer(); }

/* Quyền trợ giúp */
function helpBlock(ic, title, ...content) {
  const p = $('#helpPanel'); p.hidden = false;
  const b = h('div', { class: 'card help-block' }, h('div', { class: 'help-title' }, icon(ic), title), ...content);
  p.append(b);
  return b;
}
function teamPickRow(label, isOn, onToggle) {
  const row = h('div', { class: 'pick-row', 'data-refresh': '' });
  const paint = () => {
    row.replaceChildren(h('span', { text: label }), ...G.teams.map((tm, i) => i === G.cur.team ? null : h('button', {
      class: 'pick', type: 'button', 'aria-pressed': String(isOn(i)), disabled: G.locked,
      onclick: () => { if (G.locked) return; onToggle(i); paint(); }
    }, tm.name)).filter(Boolean));
  };
  row.addEventListener('refresh', paint); paint();
  return row;
}
function useLife(key) {
  if (!G || G.ended || G.locked) return;
  const t = curTeam();
  if (t.used[key]) return;
  t.used[key] = true;
  G.cur.lifes.add(key);
  Sound.help();
  const cur = G.list[G.idx];
  const bonusNote = () => h('p', { class: 'note-sm', text: `Tổ hỗ trợ được +${fmtPts(G.bonusMilli)} điểm nếu tổ được giúp trả lời đúng.` });
  if (key === 'fifty') {
    const wrong = shuffle([0, 1, 2, 3].filter(i => i !== cur.correct && !G.removed.has(i))).slice(0, 2);
    wrong.forEach(i => { G.removed.add(i); const b = optEls()[i]; b.classList.add('gone'); b.classList.remove('sel'); b.disabled = true; });
    if (G.selected != null && G.removed.has(G.selected)) unselect();
  } else if (key === 'call') {
    addTime(30);
    const out = h('span', { class: 'draw-num', text: '—' });
    const drawBtn = h('button', { class: 'btn soft', type: 'button' }, icon('dice'), 'Bốc thăm số thứ tự');
    drawBtn.addEventListener('click', () => { out.textContent = 'Bạn số ' + (1 + Math.floor(Math.random() * RULES.classSize)); Sound.select(); });
    helpBlock('phone', 'Gọi điện cho người thân',
      h('p', { text: `Mời 1 bạn bất kỳ trong lớp giúp ${t.name} trả lời.` }),
      h('div', { class: 'draw-row' }, drawBtn, out),
      teamPickRow('Bạn được gọi thuộc:', i => G.cur.call === i, i => { G.cur.call = G.cur.call === i ? null : i; }),
      bonusNote());
  } else if (key === 'council') {
    addTime(30);
    G.teams.forEach((_, i) => { if (i !== G.cur.team) G.cur.council.add(i); });
    helpBlock('council', 'Tư vấn của tổ chuyên môn',
      h('p', { text: `Các tổ còn lại thảo luận và tư vấn cho ${t.name}. Bỏ chọn tổ không tham gia.` }),
      teamPickRow('Tổ tham gia tư vấn:', i => G.cur.council.has(i), i => { G.cur.council.has(i) ? G.cur.council.delete(i) : G.cur.council.add(i); }),
      bonusNote());
  } else if (key === 'expert') {
    addTime(30);
    helpBlock('expert', 'Hỏi chuyên gia', h('p', { text: `Mời giáo viên đưa ra gợi ý cho ${t.name}.` }));
  }
  toast(`${t.name} dùng trợ giúp: câu này nhận nửa số điểm nếu trả lời đúng.`);
  syncLifelines();
}

/* Thang điểm */
function renderLadder() {
  const list = $('#ladder');
  list.replaceChildren();
  for (let i = G.n - 1; i >= 0; i--) {
    const lv = G.list[i].src.lv;
    const cls = ['rung'];
    if (G.status[i] === 'ok') cls.push('ok');
    else if (G.status[i] === 'bad') cls.push('bad');
    else if (i === G.idx && !G.ended) cls.push('current');
    list.append(h('li', { class: cls.join(' '), 'aria-current': i === G.idx ? 'step' : null },
      h('span', { class: 'rung-n', text: (G.status[i] === 'ok' ? '✓ ' : G.status[i] === 'bad' ? '✗ ' : '') + (i + 1) }),
      h('span', { class: 'lv ' + lv, text: lv }),
      h('span', { class: 'rung-pts', text: fmtPts(ptsOf(lv)) + ' đ' })));
  }
  $('#ladderTotal').textContent = 'Tối đa ' + fmtPts(G.maxTotal) + ' đ';
}

/* Kết thúc & báo cáo */
function ranked() { return G.teams.map((t, i) => ({ ...t, i })).sort((a, b) => b.score - a.score || b.correct - a.correct || a.i - b.i); }
function endGame() {
  stopTimer();
  G.ended = true; G.duration = Date.now() - G.startAt; G.saved = false;
  renderResult();
  show('result');
  Sound.fanfare(); FX.rain();
}
function renderResult() {
  const r = ranked();
  const tie = r.length > 1 && r[0].score === r[1].score;
  const correctAll = G.teams.reduce((s, t) => s + t.correct, 0);
  $('#resOutcome').textContent = tie ? 'Hòa điểm ở vị trí dẫn đầu' : `${r[0].name} chiến thắng`;
  $('#resBig').textContent = fmtPts(r[0].score);
  $('#resMsg').textContent = `Đã chơi ${G.log.length}/${G.n} câu. Tổng điểm tối đa của bộ câu hỏi là ${fmtPts(G.maxTotal)} điểm.`;
  $('#rankWrap').replaceChildren(h('table', { class: 'rank-table' },
    h('thead', {}, h('tr', {}, ['Hạng', 'Tổ', 'Điểm', 'Đúng', 'Trợ giúp', 'Điểm hỗ trợ'].map(x => h('th', { text: x })))),
    h('tbody', {}, r.map((t, k) => h('tr', { class: t.score === r[0].score ? 'win' : '' },
      h('td', { text: String(k + 1) }), h('td', { text: t.name }), h('td', { class: 'sc', text: fmtPts(t.score) }),
      h('td', { text: `${t.correct}/${t.asked}` }), h('td', { text: String(t.helps) }), h('td', { text: t.bonus ? '+' + fmtPts(t.bonus) : '0' }))))));
  const helps = G.teams.reduce((s, t) => s + t.helps, 0);
  $('#resStats').replaceChildren(
    h('div', { class: 'stat' }, h('b', { text: `${correctAll}/${G.log.length}` }), h('span', { text: 'Câu trả lời đúng' })),
    h('div', { class: 'stat' }, h('b', { text: fmtTime(G.duration) }), h('span', { text: 'Thời gian chơi' })),
    h('div', { class: 'stat' }, h('b', { text: String(helps) }), h('span', { text: 'Lượt dùng trợ giúp' })),
    h('div', { class: 'stat' }, h('b', { text: `${G.teams.length} tổ` }), h('span', { text: 'Thi đấu' })));
  $('#saveName').value = prefs.className || '';
  $('#btnSave').disabled = false; $('#btnSave').textContent = 'Lưu kết quả';
  const list = $('#reviewList');
  list.replaceChildren(...G.log.map((e, i) => h('li', { class: 'card rv' + (e.ok ? '' : ' bad') },
    h('div', { class: 'rv-meta' },
      h('strong', { text: `Câu ${i + 1}` }), h('span', { class: 'lv ' + e.q.lv, text: `${e.q.lv} · ${fmtPts(e.base)} đ` }),
      h('span', { class: 'chip', text: e.team }),
      h('span', { text: e.timeout ? 'Hết giờ' : `Chọn ${LETTERS[e.chosen]}` }),
      h('span', { class: 'rv-gain', text: e.ok ? `Đúng · +${fmtPts(e.gain)}` : 'Sai · +0' })),
    h('p', { class: 'rv-q', text: e.q.q }),
    h('ul', { class: 'rv-opts' }, e.opts.map((t, k) => h('li', { class: k === e.correct ? 'c' : k === e.chosen ? 'w' : '' }, `${LETTERS[k]}. ${t}`))),
    e.lifes.length ? h('p', { class: 'rv-ex', text: 'Trợ giúp: ' + e.lifes.join(', ') + (e.helpers.length ? ` · Tổ hỗ trợ: ${e.helpers.join(', ')}` + (e.bonusEach ? ` (+${fmtPts(e.bonusEach)} mỗi tổ)` : '') : '') }) : null,
    e.q.ex ? h('p', { class: 'rv-ex', text: e.q.ex }) : null)));
  if (!G.log.length) list.append(h('li', { class: 'card muted', text: 'Chưa có câu nào được trả lời.' }));
}
function reportText() {
  const r = ranked();
  const lines = [`KẾT QUẢ TRÒ CHƠI: ${DECK.title}`, `Lớp: ${($('#saveName').value || prefs.className || '').trim() || '…'} · ${fmtDate(Date.now())} · Thời gian chơi ${fmtTime(G.duration)}`, '', 'XẾP HẠNG'];
  r.forEach((t, k) => lines.push(`${k + 1}. ${t.name}: ${fmtPts(t.score)} điểm (đúng ${t.correct}/${t.asked} câu, dùng trợ giúp ${t.helps} lần, điểm hỗ trợ ${fmtPts(t.bonus)})`));
  lines.push('', 'CHI TIẾT TỪNG CÂU');
  G.log.forEach((e, i) => {
    lines.push(`Câu ${i + 1} (${e.q.lv}, ${fmtPts(e.base)} đ) – ${e.team} – ${e.timeout ? 'hết giờ' : 'chọn ' + LETTERS[e.chosen]} – đáp án ${LETTERS[e.correct]} – ${e.ok ? 'ĐÚNG' : 'SAI'} – +${fmtPts(e.gain)}` +
      (e.lifes.length ? ` – trợ giúp: ${e.lifes.join(', ')}` : '') + (e.helpers.length ? ` – tổ hỗ trợ: ${e.helpers.join(', ')}${e.bonusEach ? ' (+' + fmtPts(e.bonusEach) + ')' : ''}` : ''));
  });
  return lines.join('\n');
}
function reportCsv() {
  const esc = v => '"' + String(v).replace(/"/g, '""') + '"';
  const rows = [['Câu', 'Mức độ', 'Điểm câu', 'Tổ trả lời', 'Đáp án chọn', 'Đáp án đúng', 'Kết quả', 'Điểm nhận', 'Trợ giúp', 'Tổ hỗ trợ', 'Điểm hỗ trợ mỗi tổ', 'Nội dung câu hỏi']];
  G.log.forEach((e, i) => rows.push([i + 1, e.q.lv, fmtPts(e.base), e.team, e.timeout ? 'Hết giờ' : LETTERS[e.chosen], LETTERS[e.correct], e.ok ? 'Đúng' : 'Sai', fmtPts(e.gain), e.lifes.join('; '), e.helpers.join('; '), fmtPts(e.bonusEach), e.q.q]));
  rows.push([]);
  rows.push(['Hạng', 'Tổ', 'Tổng điểm', 'Số câu đúng', 'Số câu được hỏi', 'Lượt trợ giúp', 'Điểm hỗ trợ']);
  ranked().forEach((t, k) => rows.push([k + 1, t.name, fmtPts(t.score), t.correct, t.asked, t.helps, fmtPts(t.bonus)]));
  return '﻿' + rows.map(r => r.map(esc).join(',')).join('\r\n');
}
async function saveResult(ev) {
  ev.preventDefault();
  if (!G || G.saved) return;
  const name = $('#saveName').value.trim().slice(0, 40);
  if (!name) { toast('Nhập tên lớp để lưu kết quả.'); $('#saveName').focus(); return; }
  prefs.className = name; savePrefs();
  $('#btnSave').disabled = true;
  try {
    const where = await Store.addResult({ deckId: DECK.id, className: name, teams: G.teams.map(t => ({ name: t.name, score: t.score })), timeMs: G.duration, at: Date.now() });
    G.saved = true; $('#btnSave').textContent = 'Đã lưu';
    toast(where === 'shared' ? 'Đã lưu kết quả vào lịch sử chung.' : 'Đã lưu kết quả trên trình duyệt này.');
  } catch {
    $('#btnSave').disabled = false;
    toast('Không lưu được kết quả. Thử lại sau.');
  }
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('Đã sao chép báo cáo.'); }
  catch {
    const ta = h('textarea', { class: 'textarea', rows: 14, readonly: true, value: text, 'aria-label': 'Nội dung báo cáo' });
    openModal({ title: 'Sao chép báo cáo', wide: true, body: h('div', { style: 'display:flex;flex-direction:column;gap:8px' }, h('p', { class: 'muted', text: 'Chọn toàn bộ nội dung bên dưới và nhấn Ctrl+C.' }), ta) });
    setTimeout(() => { ta.focus(); ta.select(); }, 60);
  }
}
async function saveFile(filename, data) {
  if (DL) {
    try { await DL.save({ filename, data }); toast('Đã gửi file để tải về.'); }
    catch { toast('Không tải được file. Hãy dùng nút Sao chép báo cáo.'); }
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([data], { type: 'text/csv;charset=utf-8' }));
    const a = h('a', { href: url, download: filename, style: 'display:none' });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Đã tải bảng điểm về máy.');
  } catch { toast('Không tải được file. Hãy dùng nút Sao chép báo cáo.'); }
}

/* ---------- Gắn sự kiện ---------- */
function goStart() { stopTimer(); setPresent(false); show('home'); $('#btnStart').focus({ preventScroll: true }); }
function init() {
  setBtn($('#btnStart'), 'play', 'Bắt đầu');
  setBtn($('#btnCopyReport'), 'copy', 'Sao chép báo cáo');
  setBtn($('#btnCsv'), 'download', 'Tải bảng điểm (CSV)');
  setBtn($('#btnHistory'), 'history', 'Kết quả đã lưu');
  setBtn($('#btnReplay'), 'play', 'Chơi lại');
  $('#btnPresent').replaceChildren(icon('present'));
  $('#btnFull').replaceChildren(icon('full'));
  $('#pbFull').replaceChildren(icon('full'));
  $('#btnSide').replaceChildren(icon('ladder'));
  syncSoundBtns();

  $('#btnStart').addEventListener('click', () => { setPresent(true); startGame(); });
  $('#brandBtn').addEventListener('click', async () => {
    if (VIEW === 'game' && G && !G.ended) { if (await confirmModal('Rời ván chơi?', 'Ván đang chơi sẽ không được lưu.', 'Rời ván', true)) { G.ended = true; goStart(); } }
    else goStart();
  });
  const toggleSound = () => { prefs.sound = !prefs.sound; savePrefs(); syncSoundBtns(); if (prefs.sound) Sound.select(); };
  $('#btnSound').addEventListener('click', toggleSound);
  $('#pbSound').addEventListener('click', toggleSound);
  $('#btnFull').addEventListener('click', toggleFull);
  $('#pbFull').addEventListener('click', toggleFull);
  $('#btnPresent').addEventListener('click', () => setPresent(!document.body.classList.contains('present')));
  $('#pbExit').addEventListener('click', () => setPresent(false));

  $('#btnLock').addEventListener('click', lockAnswer);
  $('#btnUnselect').addEventListener('click', unselect);
  $('#btnWalk').addEventListener('click', walkAway);
  $('#btnSide').addEventListener('click', () => $('#side').classList.toggle('open'));
  $('#saveForm').addEventListener('submit', saveResult);
  $('#btnCopyReport').addEventListener('click', () => copyText(reportText()));
  $('#btnCsv').addEventListener('click', () => saveFile(`ket-qua-${slugName(DECK.title)}-${slugName($('#saveName').value || 'lop')}.csv`, reportCsv()));
  $('#btnHistory').addEventListener('click', showHistory);
  $('#btnReplay').addEventListener('click', () => { setPresent(true); startGame(); });
  $('#btnHome').addEventListener('click', goStart);

  document.addEventListener('keydown', e => {
    if ($('#modalRoot').children.length) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'p' && (VIEW === 'game' || VIEW === 'result')) { setPresent(!document.body.classList.contains('present')); return; }
    if (VIEW !== 'game' || !G || G.ended) return;
    const map = { '1': 0, '2': 1, '3': 2, '4': 3, a: 0, b: 1, c: 2, d: 3 };
    if (k in map && !G.locked) { e.preventDefault(); selectOpt(map[k]); return; }
    if (k === 'escape') { if (G.selected != null && !G.locked) unselect(); else if (document.body.classList.contains('present')) setPresent(false); return; }
    if ((k === 'n' || k === 'arrowright') && !$('#revealPanel').hidden) { e.preventDefault(); const n = $('#btnNext'); if (n) n.click(); return; }
    if (k === 'enter') {
      if (tag === 'button') return;
      if (!G.locked && G.selected != null) { e.preventDefault(); lockAnswer(); }
      else if (!$('#revealPanel').hidden) { e.preventDefault(); const n = $('#btnNext'); if (n) n.click(); }
    }
  });
  window.addEventListener('beforeunload', e => { if (VIEW === 'game' && G && !G.ended) { e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('resize', () => { if (FX.ctx) FX.size(); });

  show('home');
  initCloud();
}
init();
</script>
